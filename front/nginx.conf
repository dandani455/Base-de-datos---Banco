server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker: con el backend en una variable, nginx lo resuelve en cada petición.
  # Así nginx arranca aunque el backend no exista todavía y sobrevive a que se reinicie (cambia de IP).
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $backend http://backend:3000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    # Backend caído o reiniciando: mismo contrato que la BD caída (§10) → el front pinta su banner.
    proxy_intercept_errors off;
    error_page 502 504 = @sin_backend;
  }

  location @sin_backend {
    default_type application/json;
    return 503 '{"error":"sin_conexion"}';
  }

  # SPA: cualquier ruta que no sea un archivo devuelve index.html (React Router decide).
  location / {
    try_files $uri /index.html;
  }
}
